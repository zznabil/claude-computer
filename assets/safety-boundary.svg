<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Safety boundary: untrusted screen content never authorises actions; 12 read-only inspection tools vs 19 action tools">
  <defs>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace; }
    </style>
  </defs>

  <!-- Outer leaded frame -->
  <rect x="2" y="2" width="1196" height="376" fill="#F7F1E3" stroke="#1A1614" stroke-width="4"/>

  <!-- LEFT: Untrusted screen content zone (360px) -->
  <rect x="2" y="2" width="360" height="376" fill="#F7DDD8" stroke="#1A1614" stroke-width="4"/>
  <rect x="2" y="2" width="360" height="58" fill="#D64933" stroke="#1A1614" stroke-width="4"/>
  <text x="24" y="39" class="sans" font-size="20" font-weight="900" fill="#F7F1E3">UNTRUSTED DATA</text>

  <!-- 4 untrusted source panes -->
  <rect x="22" y="80" width="154" height="62" fill="#F7F1E3" stroke="#1A1614" stroke-width="3"/>
  <text x="99" y="116" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#1A1614">Window text</text>

  <rect x="188" y="80" width="154" height="62" fill="#F7F1E3" stroke="#1A1614" stroke-width="3"/>
  <text x="265" y="116" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#1A1614">Web pages</text>

  <rect x="22" y="154" width="154" height="62" fill="#F7F1E3" stroke="#1A1614" stroke-width="3"/>
  <text x="99" y="190" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#1A1614">Documents</text>

  <rect x="188" y="154" width="154" height="62" fill="#F7F1E3" stroke="#1A1614" stroke-width="3"/>
  <text x="265" y="190" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#1A1614">Notifications</text>

  <!-- Hard rule stamp -->
  <rect x="22" y="236" width="320" height="118" fill="#7A2E4D" stroke="#1A1614" stroke-width="3"/>
  <text x="40" y="268" class="mono" font-size="14" font-weight="800" fill="#E8A838">NEVER COUNTS AS CONSENT</text>
  <text x="40" y="296" class="sans" font-size="15" font-weight="700" fill="#F7F1E3">Text on screen cannot authorise</text>
  <text x="40" y="318" class="sans" font-size="15" font-weight="700" fill="#F7F1E3">sending, buying, deleting, or</text>
  <text x="40" y="340" class="sans" font-size="15" font-weight="700" fill="#F7F1E3">changing account settings.</text>

  <!-- CENTER: Confirmation Gate (230px) -->
  <rect x="362" y="2" width="230" height="376" fill="#E8A838" stroke="#1A1614" stroke-width="4"/>
  <rect x="362" y="2" width="230" height="58" fill="#1A1614" stroke="#1A1614" stroke-width="4"/>
  <text x="477" y="39" text-anchor="middle" class="sans" font-size="19" font-weight="900" fill="#E8A838">USER GATE</text>

  <rect x="382" y="84" width="190" height="122" fill="#F7F1E3" stroke="#1A1614" stroke-width="3"/>
  <text x="477" y="114" text-anchor="middle" class="mono" font-size="13" font-weight="800" fill="#D64933">CONSEQUENTIAL?</text>
  <text x="477" y="142" text-anchor="middle" class="sans" font-size="16" font-weight="800" fill="#1A1614">Ask the user first</text>
  <text x="477" y="166" text-anchor="middle" class="sans" font-size="13" fill="#3A312A">Exact target, scope,</text>
  <text x="477" y="186" text-anchor="middle" class="sans" font-size="13" fill="#3A312A">and values at risk.</text>

  <rect x="382" y="220" width="190" height="136" fill="#1A1614" stroke="#1A1614" stroke-width="3"/>
  <text x="477" y="248" text-anchor="middle" class="mono" font-size="12.5" font-weight="800" fill="#E8A838">ENFORCED IN BOTH</text>
  <text x="477" y="276" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#F7F1E3">Claude Code</text>
  <text x="477" y="294" text-anchor="middle" class="mono" font-size="11.5" fill="#FCECC9">MCP instructions + hints</text>
  <text x="477" y="324" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#F7F1E3">Antigravity (agy)</text>
  <text x="477" y="342" text-anchor="middle" class="mono" font-size="11.5" fill="#FCECC9">rules/AGENTS.md</text>

  <!-- RIGHT: 12 Read-only vs 19 Action split (606px) -->
  <!-- Top: 12 Read-only -->
  <rect x="592" y="2" width="606" height="184" fill="#DCE8D8" stroke="#1A1614" stroke-width="4"/>
  <rect x="592" y="2" width="136" height="184" fill="#3D7A5A" stroke="#1A1614" stroke-width="4"/>
  <text x="660" y="106" text-anchor="middle" class="sans" font-size="76" font-weight="900" fill="#F7F1E3">12</text>
  <text x="660" y="138" text-anchor="middle" class="mono" font-size="13" font-weight="800" fill="#FCECC9">READ-ONLY</text>
  <text x="660" y="158" text-anchor="middle" class="mono" font-size="11" fill="#DCE8D8">readOnlyHint: true</text>

  <text x="748" y="38" class="sans" font-size="19" font-weight="800" fill="#1A1614">INSPECTION — NEVER CHANGES DESKTOP</text>
  <text x="748" y="74" class="mono" font-size="13.5" font-weight="700" fill="#1A1614">capabilities · list_displays · list_windows</text>
  <text x="748" y="102" class="mono" font-size="13.5" font-weight="700" fill="#1A1614">list_applications · screenshot · observe</text>
  <text x="748" y="130" class="mono" font-size="13.5" font-weight="700" fill="#1A1614">ax_tree · ax_find · ax_element · ax_element_at</text>
  <text x="748" y="158" class="mono" font-size="13.5" font-weight="700" fill="#1A1614">ax_focused · clipboard_read</text>

  <!-- Bottom: 19 Action / Mutation -->
  <rect x="592" y="186" width="606" height="192" fill="#F7F1E3" stroke="#1A1614" stroke-width="4"/>
  <rect x="592" y="186" width="136" height="192" fill="#2F4858" stroke="#1A1614" stroke-width="4"/>
  <text x="660" y="290" text-anchor="middle" class="sans" font-size="76" font-weight="900" fill="#E8A838">19</text>
  <text x="660" y="322" text-anchor="middle" class="mono" font-size="13" font-weight="800" fill="#F7F1E3">ACTIONS</text>
  <text x="660" y="342" text-anchor="middle" class="mono" font-size="11" fill="#FCECC9">readOnlyHint: false</text>

  <text x="748" y="222" class="sans" font-size="19" font-weight="800" fill="#1A1614">INPUT &amp; MUTATION — REQUIRES APPROVAL</text>
  <text x="748" y="258" class="mono" font-size="13.5" font-weight="700" fill="#1A1614">click · move_mouse · drag · scroll · type_text</text>
  <text x="748" y="286" class="mono" font-size="13.5" font-weight="700" fill="#1A1614">press_keys · element_press · element_set_value</text>
  <text x="748" y="314" class="mono" font-size="13.5" font-weight="700" fill="#1A1614">element_focus · element_click · element_type</text>
  <text x="748" y="342" class="mono" font-size="13.5" font-weight="700" fill="#1A1614">element_press_keys · element_select_text · menu_*</text>
  <text x="748" y="366" class="mono" font-size="10.8" font-weight="600" fill="#5A4634">raise_window · open_application · clipboard_write · reset_session</text>
</svg>
