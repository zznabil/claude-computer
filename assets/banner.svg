<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="computer: desktop computer use MCP plugin for Claude Code and Antigravity">
  <defs>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace; }
    </style>
  </defs>

  <!-- Outer leaded frame -->
  <rect x="2" y="2" width="1196" height="356" fill="#F7F1E3" stroke="#1A1614" stroke-width="4"/>

  <!-- Left column: stacked typographic stained-glass panes -->
  <!-- Top-left big buttermilk pane: COMPUTER -->
  <rect x="2" y="2" width="678" height="156" fill="#F7F1E3" stroke="#1A1614" stroke-width="4"/>
  <text x="34" y="122" class="sans" font-size="108" font-weight="900" letter-spacing="-3" fill="#1A1614">COMPUTER</text>

  <!-- Middle-left paprika pane: USE + plain hook -->
  <rect x="2" y="158" width="258" height="122" fill="#D64933" stroke="#1A1614" stroke-width="4"/>
  <text x="34" y="254" class="sans" font-size="96" font-weight="900" letter-spacing="-2" fill="#F7F1E3">USE</text>

  <rect x="260" y="158" width="420" height="122" fill="#FCECC9" stroke="#1A1614" stroke-width="4"/>
  <text x="286" y="206" class="sans" font-size="23" font-weight="700" fill="#1A1614">See and operate real desktop apps</text>
  <text x="286" y="236" class="sans" font-size="23" font-weight="700" fill="#1A1614">behind your active window.</text>
  <text x="286" y="264" class="mono" font-size="14" font-weight="600" fill="#5A4634">Zero npm deps · oh-my-pi Rust addon (MIT)</text>

  <!-- Bottom-left leaded host/stats strip -->
  <rect x="2" y="280" width="226" height="78" fill="#E8A838" stroke="#1A1614" stroke-width="4"/>
  <text x="24" y="314" class="mono" font-size="13" font-weight="700" fill="#1A1614">HOST 01</text>
  <text x="24" y="342" class="sans" font-size="22" font-weight="800" fill="#1A1614">Claude Code</text>

  <rect x="228" y="280" width="226" height="78" fill="#3D7A5A" stroke="#1A1614" stroke-width="4"/>
  <text x="250" y="314" class="mono" font-size="13" font-weight="700" fill="#FCECC9">HOST 02</text>
  <text x="250" y="342" class="sans" font-size="22" font-weight="800" fill="#F7F1E3">Antigravity</text>

  <rect x="454" y="280" width="226" height="78" fill="#2F4858" stroke="#1A1614" stroke-width="4"/>
  <text x="476" y="314" class="mono" font-size="13" font-weight="700" fill="#E8A838">SURFACE</text>
  <text x="476" y="342" class="sans" font-size="22" font-weight="800" fill="#F7F1E3">31 MCP Tools</text>

  <!-- Right column: stained-glass overlapping desktop windows diagram -->
  <rect x="680" y="2" width="518" height="278" fill="#2F4858" stroke="#1A1614" stroke-width="4"/>

  <!-- Subtle leaded grid lines inside desktop pane -->
  <line x1="680" y1="94" x2="1198" y2="94" stroke="#1A1614" stroke-width="2" opacity="0.35"/>
  <line x1="680" y1="186" x2="1198" y2="186" stroke="#1A1614" stroke-width="2" opacity="0.35"/>
  <line x1="852" y1="2" x2="852" y2="280" stroke="#1A1614" stroke-width="2" opacity="0.35"/>
  <line x1="1026" y1="2" x2="1026" y2="280" stroke="#1A1614" stroke-width="2" opacity="0.35"/>

  <!-- Back window: Agent target (operating in background) -->
  <rect x="854" y="28" width="316" height="196" fill="#DCE8D8" stroke="#1A1614" stroke-width="4"/>
  <rect x="854" y="28" width="316" height="36" fill="#3D7A5A" stroke="#1A1614" stroke-width="4"/>
  <text x="870" y="51" class="mono" font-size="14" font-weight="700" fill="#F7F1E3">BACKGROUND TARGET</text>
  <circle cx="1148" cy="46" r="6" fill="#E8A838" stroke="#1A1614" stroke-width="2"/>
  <circle cx="1128" cy="46" r="6" fill="#F7F1E3" stroke="#1A1614" stroke-width="2"/>

  <!-- Inside background window: AX ref control (positioned cleanly in the visible area) -->
  <rect x="1014" y="84" width="140" height="44" fill="#F7F1E3" stroke="#1A1614" stroke-width="3"/>
  <rect x="1026" y="92" width="116" height="28" fill="#E8A838" stroke="#1A1614" stroke-width="2.5"/>
  <text x="1084" y="111" text-anchor="middle" class="mono" font-size="14" font-weight="800" fill="#1A1614">ref=e12</text>

  <rect x="1014" y="148" width="140" height="42" fill="#D64933" stroke="#1A1614" stroke-width="3"/>
  <text x="1084" y="174" text-anchor="middle" class="mono" font-size="14" font-weight="800" fill="#F7F1E3">press e14</text>

  <!-- Front window: User's active window (stays focused) -->
  <rect x="708" y="88" width="286" height="168" fill="#F7F1E3" stroke="#1A1614" stroke-width="4"/>
  <rect x="708" y="88" width="286" height="36" fill="#E8A838" stroke="#1A1614" stroke-width="4"/>
  <text x="724" y="111" class="mono" font-size="14" font-weight="800" fill="#1A1614">YOUR FRONT WINDOW</text>
  <rect x="726" y="142" width="250" height="22" fill="#FCECC9" stroke="#1A1614" stroke-width="2"/>
  <text x="736" y="158" class="mono" font-size="12" font-weight="700" fill="#1A1614">Focus stays here while you work</text>
  <rect x="726" y="178" width="170" height="14" fill="#1A1614" opacity="0.18"/>
  <rect x="726" y="202" width="218" height="14" fill="#1A1614" opacity="0.18"/>
  <rect x="726" y="226" width="126" height="14" fill="#1A1614" opacity="0.18"/>

  <!-- Dashed reach-behind arrow pointing to background ref -->
  <line x1="996" y1="106" x2="1010" y2="106" stroke="#D64933" stroke-width="3.5"/>
  <polygon points="1014,106 1004,100 1004,112" fill="#D64933"/>

  <!-- Bottom-right platform pane -->
  <rect x="680" y="280" width="288" height="78" fill="#F7F1E3" stroke="#1A1614" stroke-width="4"/>
  <text x="702" y="313" class="mono" font-size="13" font-weight="700" fill="#5A4634">PLATFORMS</text>
  <text x="702" y="342" class="sans" font-size="21" font-weight="800" fill="#1A1614">Win · macOS · Linux</text>

  <rect x="968" y="280" width="230" height="78" fill="#7A2E4D" stroke="#1A1614" stroke-width="4"/>
  <text x="990" y="313" class="mono" font-size="13" font-weight="700" fill="#FCECC9">EMERGENCY STOP</text>
  <text x="990" y="342" class="sans" font-size="21" font-weight="800" fill="#F7F1E3">Press Esc</text>
</svg>
